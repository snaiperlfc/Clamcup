name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Helper live test
        run: swift build && Tests/helper-live-test.sh
      - name: Bundle
        run: scripts/bundle.sh
